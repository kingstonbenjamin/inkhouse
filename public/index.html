function setTemp(e, delta) {
  var cur = localTemp[e] !== undefined ? localTemp[e] : A(e, 'temperature');
  if (cur === undefined || cur === null) return;
  var lo = A(e, 'min_temp') || 16, hi = A(e, 'max_temp') || 30, step = A(e, 'target_temp_step') || 1;
  // WHY: use the AC's own step (often 0.5°) and round, so 0.1 + 0.2 style float errors never reach HA
  localTemp[e] = Math.max(lo, Math.min(hi, Math.round((cur + delta * step) / step) * step));
  // WHY: send one call after the taps stop, instead of one per tap
  clearTimeout(tempTimer[e]);
  tempTimer[e] = setTimeout(function () { tempTimer[e] = null; act(e, 'temperature', localTemp[e]); }, 1200);
  render();
}

function tap(a, id, v) {
  var D = UI.dishwasher, i;
  switch (a) {
    case 'wake': view.idle = false; break;
    case 'page': view.page = v; view.sheet = null; view.dialog = null; break;
    // WHY: the still's URL is fixed when the sheet opens, so live-data redraws don't reload the picture
    case 'open': if (id.indexOf('cam:') === 0) view.camT = now(); view.sheet = id; if (id === 'dish') dish.prog = null; break;
    case 'close': view.sheet = null; view.dialog = null; break;
    case 'night':
      view.night = !view.night;
      try { localStorage.setItem('ink-night', view.night ? '1' : '0'); } catch (e) {}
      break;
    case 'refresh': poll(true); break;
    case 'toggle': var r = UI.rooms[+id]; act(r.climate, 'power', roomOn(r) ? 0 : 1); return;
    case 'step': setTemp(UI.rooms[+view.sheet.slice(5)].climate, +v); return;
    case 'mode': act(id, 'hvac_mode', v); return;
    case 'fan': act(id, 'fan_mode', v); return;
    case 'askAllOff': view.dialog = 'alloff'; break;
    case 'allOff': view.dialog = null; act(UI.allOff, 'run'); return;
    case 'door': if (S(UI.lock.entity) === 'locked') view.dialog = 'unlock'; else { act(UI.lock.entity, 'lock'); return; } break;
    case 'unlock': view.dialog = null; act(UI.lock.entity, 'unlock'); return;
    case 'routine': act(UI.routines[+id].entity, 'run'); return;
    case 'vset': act(id, 'select', v); return;
    case 'vusual':
      for (i = 0; i < UI.vacuum.settings.length; i++) { var st = UI.vacuum.settings[i]; if (!bad(S(st.entity)) && S(st.entity) !== st.usual) act(st.entity, 'select', st.usual); }
      return;
    case 'vacStart': act(UI.vacuum.entity, 'start'); return;
    case 'vreset': act(UI.vacuum.resetSensor, 'press'); return;
    case 'vshort': act(UI.vacuum.shortcut.entity, 'press'); return;
    case 'vacDock': act(UI.vacuum.entity, 'dock'); return;
    case 'dprog': dish.prog = v; break;
    case 'dopt': var o = D.options[+id]; if (bad(S(o.entity))) return; act(o.entity, 'switch', S(o.entity) === 'on' ? 0 : 1); return;
    case 'dwhen': dish.when = +v; break;
    case 'dstart':
      if (S(D.remoteStart) !== 'on') { say('Press remote start on the dishwasher first'); break; }
      var prog = dish.prog || (bad(S(D.selected)) ? D.usual : S(D.selected)), at = D.startTimes[dish.when][1];
      if (at) act(D.delay, 'number', secondsUntil(at));
      // WHY: the delay must be set before the program starts, so the start call waits a moment
      setTimeout(function () { act(D.active, 'select', prog); }, at ? 1500 : 0);
      return;
    case 'dstop': act(D.stop, 'press'); return;
    default: return;
  }
  render();
}

app.addEventListener('click', function (ev) {
  lastTap = now();
  var t = ev.target;
  while (t && t !== app && !(t.getAttribute && t.getAttribute('data-a'))) t = t.parentNode;
  if (!t || t === app) { if (view.idle) { view.idle = false; render(); } return; }
  var a = t.getAttribute('data-a');
  // WHY: the round icon toggles the AC; without this the tile behind it would also open the sheet
  if (ev.stopPropagation) ev.stopPropagation();
  tap(a, t.getAttribute('data-id'), t.getAttribute('data-v'));
}, false);

// Idle clock after 2 minutes; the clock only redraws once a minute
setInterval(function () {
  if (!view.idle && !view.sheet && !view.dialog && now() - lastTap > 120000) view.idle = true;
  render();
}, 60000);

function fit() {
  // WHY: fit the whole 420x560 design inside the browser's visible area, so nothing needs scrolling
  var s = Math.min(window.innerWidth / 420, window.innerHeight / 560);
  app.style.height = Math.round(window.innerHeight / s) + 'px';
  app.style.left = Math.max(0, Math.round((window.innerWidth - 420 * s) / 2)) + 'px';
  app.style.webkitTransform = app.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit, false);
fit();

xhr('GET', 'api/config', null, function (st, d) {
  if (st !== 200 || !d) { app.innerHTML = '<p style="padding:20px;font-size:18px">Could not load the panel config. Retrying…</p>'; setTimeout(function () { location.reload(); }, 10000); return; }
  TITLE = d.title || TITLE; UI = d.ui;
  // Per-home names for raw option values, e.g. { "Map 1": "Downstairs" }
  if (UI.labels) for (var k in UI.labels) LABEL[k] = UI.labels[k];
  UI.rooms = UI.rooms || []; UI.outside = UI.outside || {}; UI.energy = UI.energy || {};
  // Deep links for testing, e.g. #page=house&sheet=alerts
  var h = /page=(\w+)/.exec(location.hash), sh = /sheet=([\w:]+)/.exec(location.hash);
  if (h) view.page = h[1];
  if (sh) view.sheet = sh[1];
  if (/idle/.test(location.hash)) view.idle = true;
  poll(true);
});
</script>
